<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDMAT | Quebra-cabeça das Representações de Curvas</title>
<meta name="theme-color" content="#61ACC9">
<meta name="description" content="Atividade interativa do REDMAT sobre conversões entre registros de representação de curvas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFFDEC'/%3E%3Ccircle cx='23' cy='32' r='14' fill='%2361ACC9'/%3E%3Ccircle cx='41' cy='32' r='14' fill='%23FD5151' fill-opacity='.9'/%3E%3C/svg%3E">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    processEscapes: true
  },
  chtml: { scale: 0.94 },
  options: { enableMenu: false }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js" id="MathJax-script"></script>
<style>
:root{
  --ink:#18212b;
  --muted:#5b6773;
  --paper:#f6f8fa;
  --panel:#ffffff;
  --line:#b9c3cc;
  --brand:#0b7d83;
  --brand-dark:#075b60;
  --accent:#e8f4f5;
  --ok:#176b3a;
  --ok-bg:#e8f6ed;
  --bad:#a52a2a;
  --bad-bg:#fff0f0;
  --warn:#825800;
  --warn-bg:#fff7dc;
  --shadow:0 4px 18px rgba(20,40,55,.10);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  line-height:1.4;
}
button{font:inherit}
.duval-app{
  max-width:1240px;
  margin:0 auto;
  padding:22px;
}
.hero{
  background:linear-gradient(135deg,#0b7d83,#075b60);
  color:white;
  border-radius:18px;
  padding:24px;
  box-shadow:var(--shadow);
}
.hero h1{margin:0 0 8px;font-size:clamp(1.55rem,3vw,2.25rem)}
.hero p{margin:0;max-width:900px}
.level-tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}
.level-tab{
  border:2px solid var(--brand);
  background:white;
  color:var(--brand-dark);
  border-radius:999px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700;
}
.level-tab[aria-selected="true"]{
  background:var(--brand);
  color:white;
}
.level-card{
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}
.level-heading{
  display:flex;
  gap:18px;
  align-items:flex-start;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.level-heading h2{margin:0 0 5px}
.level-heading p{margin:0;color:var(--muted);max-width:850px}
.status{
  min-width:150px;
  background:var(--accent);
  border:1px solid #b9dfe1;
  border-radius:12px;
  padding:9px 12px;
  font-weight:700;
  text-align:center;
}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{
  min-width:900px;
  display:grid;
  grid-template-columns:repeat(4,minmax(205px,1fr));
  gap:7px;
  padding:7px;
  background:#d9e0e5;
  border-radius:15px;
}
.board-header{
  min-height:80px;
  background:#afd3df;
  border:1px solid #73838f;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:1.05rem;
  font-weight:800;
  padding:10px;
}
.slot{
  min-height:160px;
  background:#fefefe;
  border:2px dashed #9aa8b3;
  border-radius:12px;
  padding:7px;
  position:relative;
  transition:.15s ease;
}
.slot.drag-over{background:#e6f5f6;border-color:var(--brand);transform:scale(1.01)}
.slot.row-correct{background:var(--ok-bg);border-color:var(--ok)}
.slot.row-wrong{background:var(--bad-bg);border-color:var(--bad)}
.slot .slot-number{
  position:absolute;
  top:5px;
  left:7px;
  color:#8b98a3;
  font-size:.72rem;
  pointer-events:none;
}
.bank-title{
  margin:18px 0 8px;
  font-weight:800;
}
.bank-help{
  font-size:.92rem;
  color:var(--muted);
  margin-bottom:10px;
}
.bank{
  display:grid;
  grid-template-columns:repeat(4,minmax(205px,1fr));
  grid-auto-rows:160px;
  gap:10px;
  min-width:900px;
  min-height:510px;
  background:#eef2f5;
  border:1px solid #c9d1d8;
  border-radius:15px;
  padding:12px;
  overflow:hidden;
}
.bank-cell{
  height:160px;
  min-width:0;
  border:1px dashed transparent;
  border-radius:12px;
}
.bank-cell:empty{
  background:rgba(255,255,255,.28);
  border-color:#cbd4db;
}
.bank .piece{
  width:100%;
  height:160px;
  min-height:160px;
}
.bank .return-btn{display:none}
.piece{
  min-height:145px;
  background:white;
  border:2px solid #758490;
  border-radius:12px;
  padding:12px;
  cursor:grab;
  box-shadow:0 2px 7px rgba(15,30,40,.08);
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  user-select:none;
}
.piece:active{cursor:grabbing}
.piece.selected{
  outline:4px solid #ffbf47;
  outline-offset:2px;
}
.piece .tag{
  position:absolute;
  top:6px;
  right:7px;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#687582;
}
.piece .content{
  text-align:center;
  overflow-wrap:anywhere;
}
.piece .content strong{display:block;margin-bottom:4px}
.piece .math{
  font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
  font-size:1.15rem;
}
.piece svg{
  width:100%;
  height:118px;
  display:block;
}
.slot .piece{
  height:100%;
  min-height:142px;
  box-shadow:none;
}
.return-btn{
  position:absolute;
  left:6px;
  bottom:5px;
  border:0;
  background:#eef2f5;
  border-radius:7px;
  padding:3px 7px;
  font-size:.72rem;
  cursor:pointer;
}
.controls{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:14px;
}
.controls button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:750;
}
.primary{background:var(--brand);color:white}
.secondary{background:#e5eaee;color:var(--ink)}
.danger{background:#f6dfdf;color:#7d2020}
.feedback{
  margin-top:13px;
  padding:12px 14px;
  border-radius:12px;
  display:none;
}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);border:1px solid #9fd1af;color:#124e2c}
.feedback.bad{background:var(--bad-bg);border:1px solid #e1aaaa;color:#7f2323}
.feedback.warn{background:var(--warn-bg);border:1px solid #e2c26f;color:#654500}
.teacher-note{
  margin-top:18px;
  background:#f8fafb;
  border:1px solid #d4dce2;
  border-radius:12px;
  padding:12px 14px;
}
.teacher-note summary{cursor:pointer;font-weight:800}
.teacher-note p{margin:8px 0 0;color:var(--muted)}
.small{font-size:.88rem;color:var(--muted)}
@media(max-width:650px){
  .duval-app{padding:10px}
  .hero,.level-card{border-radius:12px}
  .piece{min-height:125px}
}

.student-bar{
  display:flex;
  gap:12px;
  align-items:end;
  flex-wrap:wrap;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.35);
}
.student-field{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:min(360px,100%);
  flex:1;
}
.student-field label{
  font-weight:750;
}
.student-field input{
  width:100%;
  border:2px solid rgba(255,255,255,.72);
  border-radius:10px;
  padding:10px 12px;
  background:white;
  color:var(--ink);
  font:inherit;
}
.report-panel{
  margin-top:18px;
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}
.report-panel h2{margin:0 0 6px}
.report-panel > p{margin:0;color:var(--muted)}
.report-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:14px;
}
.report-actions button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:750;
}
.report-output{
  display:none;
  margin-top:16px;
}
.report-output.show{display:block}
.report-header{
  border-bottom:2px solid #d7e0e5;
  padding-bottom:12px;
  margin-bottom:14px;
}
.report-header h3{margin:0 0 4px}
.report-header p{margin:2px 0;color:var(--muted)}
.report-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
  gap:10px;
  margin:14px 0;
}
.report-metric{
  background:#f4f7f8;
  border:1px solid #d5dde2;
  border-radius:12px;
  padding:12px;
}
.report-metric span{
  display:block;
  color:var(--muted);
  font-size:.82rem;
}
.report-metric strong{
  display:block;
  font-size:1.35rem;
  margin-top:3px;
}
.level-report{
  border:1px solid #d6dee4;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
}
.level-report h4{margin:0 0 8px}
.level-report ul{
  margin:0;
  padding-left:19px;
}
.level-report li{margin:3px 0}
.level-report .level-feedback{
  margin-top:9px;
  padding:9px 11px;
  border-radius:9px;
  background:var(--accent);
}
.final-feedback{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:var(--ok-bg);
  border:1px solid #a9d3b5;
}
.report-note{
  margin-top:12px;
  font-size:.88rem;
  color:var(--muted);
}

.report-panel.locked .report-actions,
.report-panel.locked .report-output{
  display:none !important;
}
.report-lock{
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  background:var(--warn-bg);
  border:1px solid #e2c26f;
  color:#654500;
}
.report-panel.unlocked .report-lock{
  display:none;
}

@media print{
  body.printing-report *{visibility:hidden !important}
  body.printing-report #reportPanel,
  body.printing-report #reportPanel *{visibility:visible !important}
  body.printing-report #reportPanel{
    position:absolute;
    inset:0;
    width:100%;
    margin:0;
    padding:20px;
    box-shadow:none;
  }
  body.printing-report .report-actions,
  body.printing-report .report-panel > p{display:none !important}
}


/* =========================================================
   IDENTIDADE VISUAL REDMAT
   Paleta principal:
   Azul  #61ACC9
   Coral #FD5151
   Creme #FFFDEC
   ========================================================= */
:root{
  --redmat-blue:#61ACC9;
  --redmat-blue-dark:#2F718C;
  --redmat-blue-soft:#E7F3F7;
  --redmat-red:#FD5151;
  --redmat-red-dark:#BD3434;
  --redmat-red-soft:#FFE8E5;
  --redmat-cream:#FFFDEC;
  --redmat-ink:#173A49;

  --ink:var(--redmat-ink);
  --muted:#526B75;
  --paper:var(--redmat-cream);
  --panel:#FFFFFF;
  --line:#B8D6E1;
  --brand:var(--redmat-blue);
  --brand-dark:var(--redmat-blue-dark);
  --accent:var(--redmat-blue-soft);
  --bad:var(--redmat-red-dark);
  --bad-bg:var(--redmat-red-soft);
  --warn:#865C16;
  --warn-bg:#FFF4D8;
  --shadow:0 12px 34px rgba(47,113,140,.14);
}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 6% 4%, rgba(97,172,201,.16) 0 95px, transparent 96px),
    radial-gradient(circle at 96% 10%, rgba(253,81,81,.11) 0 75px, transparent 76px),
    linear-gradient(180deg,#FFFDEC 0%,#FFF9ED 100%);
  color:var(--redmat-ink);
}

button,
input{
  font-family:inherit;
}

button{
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
}

button:hover{
  transform:translateY(-1px);
}

button:focus-visible,
input:focus-visible,
.piece:focus-visible,
.slot:focus-visible{
  outline:4px solid rgba(253,81,81,.32);
  outline-offset:3px;
}

.duval-app{
  padding-top:28px;
  padding-bottom:42px;
}

.hero{
  position:relative;
  overflow:hidden;
  color:var(--redmat-ink);
  background:
    linear-gradient(115deg,rgba(255,253,236,.98),rgba(231,243,247,.96));
  border:3px solid var(--redmat-blue);
  border-top:12px solid var(--redmat-red);
  border-radius:22px;
  padding:27px 30px 25px;
  box-shadow:var(--shadow);
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.hero::before{
  width:185px;
  height:185px;
  right:-58px;
  top:-72px;
  background:rgba(97,172,201,.20);
  border:22px solid rgba(255,253,236,.68);
}

.hero::after{
  width:86px;
  height:86px;
  right:92px;
  bottom:-53px;
  background:rgba(253,81,81,.18);
}

.hero h1{
  position:relative;
  margin:10px 0 8px;
  max-width:850px;
  color:var(--redmat-ink);
  letter-spacing:-.025em;
}

.hero h1::after{
  content:"";
  display:block;
  width:78px;
  height:6px;
  margin-top:13px;
  border-radius:999px;
  background:var(--redmat-red);
}

.hero p{
  position:relative;
  color:#3C5A66;
  font-size:1.02rem;
}

.redmat-kicker{
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  color:var(--redmat-blue-dark);
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase;
}

.redmat-kicker strong{
  color:var(--redmat-red-dark);
  font-size:.92rem;
  letter-spacing:.085em;
}

.redmat-mark{
  display:inline-flex;
  align-items:center;
  gap:3px;
}

.redmat-mark i{
  display:block;
  width:9px;
  height:9px;
  border-radius:3px;
  background:var(--redmat-blue);
  transform:rotate(45deg);
}

.redmat-mark i:nth-child(2){
  background:var(--redmat-red);
}

.redmat-mark i:nth-child(3){
  background:var(--redmat-blue);
}

.student-bar{
  position:relative;
  border-top:1px solid rgba(47,113,140,.24);
}

.student-field input{
  border:2px solid var(--redmat-blue);
  background:rgba(255,255,255,.88);
  box-shadow:0 3px 0 rgba(97,172,201,.15);
}

.student-field input::placeholder{
  color:#718B95;
}

.level-tabs{
  padding:5px 0 2px;
}

.level-tab{
  border:2px solid var(--redmat-blue);
  background:var(--redmat-cream);
  color:var(--redmat-blue-dark);
  box-shadow:0 4px 0 rgba(97,172,201,.18);
}

.level-tab:hover{
  background:var(--redmat-blue-soft);
  box-shadow:0 5px 0 rgba(97,172,201,.24);
}

.level-tab[aria-selected="true"]{
  background:var(--redmat-blue);
  border-color:var(--redmat-blue-dark);
  color:var(--redmat-ink);
  box-shadow:inset 0 -5px 0 rgba(47,113,140,.25);
}

.level-card,
.report-panel{
  border:1px solid rgba(97,172,201,.38);
  border-top:7px solid var(--redmat-blue);
  background:rgba(255,255,255,.95);
  box-shadow:var(--shadow);
}

.level-heading h2,
.report-panel h2{
  color:var(--redmat-blue-dark);
}

.status{
  color:var(--redmat-ink);
  background:var(--redmat-blue-soft);
  border:2px solid var(--redmat-blue);
  box-shadow:inset 6px 0 0 var(--redmat-red);
}

.board{
  background:var(--redmat-blue-soft);
  border:2px solid var(--redmat-blue);
  box-shadow:inset 0 0 0 5px rgba(255,253,236,.62);
}

.board-header{
  color:var(--redmat-ink);
  background:var(--redmat-blue);
  border:2px solid var(--redmat-blue-dark);
  border-top:7px solid var(--redmat-red);
  box-shadow:0 4px 0 rgba(47,113,140,.18);
}

.slot{
  background:#FFFFFF;
  border-color:rgba(47,113,140,.55);
}

.slot.drag-over{
  background:var(--redmat-blue-soft);
  border-color:var(--redmat-red);
  box-shadow:0 0 0 5px rgba(253,81,81,.13);
}

.slot .slot-number{
  color:var(--redmat-blue-dark);
  font-weight:700;
}

.bank-title{
  color:var(--redmat-blue-dark);
  font-size:1.08rem;
}

.bank-title::before{
  content:"";
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:8px;
  border-radius:3px;
  background:var(--redmat-red);
  transform:rotate(45deg);
}

.bank{
  background:
    linear-gradient(135deg,rgba(231,243,247,.96),rgba(255,253,236,.96));
  border:2px solid rgba(97,172,201,.62);
}

.bank-cell:empty{
  background:rgba(255,253,236,.72);
  border-color:rgba(97,172,201,.45);
}

.piece{
  color:var(--redmat-ink);
  background:linear-gradient(180deg,#FFFFFF 0%,#FFFDF5 100%);
  border:2px solid var(--redmat-blue-dark);
  box-shadow:0 4px 11px rgba(47,113,140,.13);
}

.piece:hover{
  border-color:var(--redmat-red);
  box-shadow:0 7px 16px rgba(47,113,140,.17);
}

.piece.selected{
  outline:5px solid var(--redmat-red);
  box-shadow:0 0 0 4px rgba(255,253,236,.95),0 8px 17px rgba(253,81,81,.19);
}

.piece .tag{
  color:var(--redmat-red-dark);
  font-weight:800;
  background:var(--redmat-red-soft);
  border-radius:999px;
  padding:2px 6px;
}

.return-btn{
  color:var(--redmat-blue-dark);
  background:var(--redmat-blue-soft);
  border:1px solid rgba(97,172,201,.55);
}

.primary{
  color:#321010;
  background:var(--redmat-red);
  box-shadow:0 4px 0 var(--redmat-red-dark);
}

.primary:hover{
  background:#FF6767;
}

.secondary{
  color:var(--redmat-ink);
  background:var(--redmat-blue-soft);
  border:2px solid var(--redmat-blue);
}

.secondary:hover{
  background:#D8EDF4;
}

.danger{
  color:var(--redmat-red-dark);
  background:#FFFFFF;
  border:2px solid var(--redmat-red);
}

.controls button,
.report-actions button{
  min-height:43px;
}

.feedback.ok{
  border-left:7px solid var(--redmat-blue);
}

.feedback.bad{
  border-left:7px solid var(--redmat-red);
}

.feedback.warn{
  border-left:7px solid #E0A12B;
}

.teacher-note{
  background:var(--redmat-cream);
  border:1px solid rgba(97,172,201,.52);
}

.teacher-note summary{
  color:var(--redmat-blue-dark);
}

.report-panel{
  border-top-color:var(--redmat-red);
}

.report-lock{
  color:#654500;
  background:#FFF4D8;
  border:1px solid #E5BC5A;
  box-shadow:inset 6px 0 0 var(--redmat-blue);
}

.report-header{
  border-bottom-color:var(--redmat-blue);
}

.report-metric{
  background:linear-gradient(135deg,var(--redmat-blue-soft),#FFFFFF);
  border:1px solid rgba(97,172,201,.55);
  border-top:5px solid var(--redmat-red);
}

.report-metric strong{
  color:var(--redmat-blue-dark);
}

.level-report{
  border:1px solid rgba(97,172,201,.52);
  border-left:7px solid var(--redmat-blue);
  background:#FFFFFF;
}

.level-report h4{
  color:var(--redmat-blue-dark);
}

.level-report .level-feedback{
  background:var(--redmat-blue-soft);
  border-left:5px solid var(--redmat-red);
}

.final-feedback{
  background:linear-gradient(135deg,var(--redmat-blue-soft),#FFFFFF);
  border:2px solid var(--redmat-blue);
  box-shadow:inset 7px 0 0 var(--redmat-red);
}

@media(max-width:650px){
  .hero{
    padding:22px 19px;
  }
  .redmat-kicker span:last-child{
    width:100%;
  }
}


/* ===== Atualização de aplicação: LaTeX, celular e persistência visual ===== */
.math.latex{
  width:100%;
  color:var(--redmat-ink);
}
.math.latex mjx-container[display="true"]{
  margin:.3rem 0 !important;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  padding:.15rem 0;

<body>
<main class="duval-app" id="duvalApp">
  <section class="hero">
    <div class="redmat-kicker">
      <span class="redmat-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>REDMAT</strong>
      <span>Registros e Educação Matemática</span>
    </div>
    <h1>Quebra-cabeça de curvas</h1>
    <p>
      Organize as peças para que cada linha contenha quatro representações da mesma curva.
      A ordem das três curvas pode variar; o que importa é a conversão correta entre os registros.
    </p>
  </section>

  <nav class="level-tabs" aria-label="Níveis da atividade" id="levelTabs"></nav>
  <section class="level-card" id="gameArea" aria-live="polite"></section>
</main>

<script>
(function(){
"use strict";

const C = {
  axis: "#173A49",
  curve: "#61ACC9",
  detail: "#FD5151",
  grid: "#D6E8EF",
  fill: "#FFFDEC"
};

function svgFrame(inner, label){
  return `<svg viewBox="0 0 220 130" role="img" aria-label="${label}">
    <rect x="0" y="0" width="220" height="130" rx="9" fill="#FFFDEC"/>
    <g stroke="${C.grid}" stroke-width="1">
      <line x1="25" y1="25" x2="25" y2="112"/><line x1="62" y1="25" x2="62" y2="112"/>
      <line x1="99" y1="25" x2="99" y2="112"/><line x1="136" y1="25" x2="136" y2="112"/>
      <line x1="173" y1="25" x2="173" y2="112"/>
      <line x1="25" y1="35" x2="200" y2="35"/><line x1="25" y1="62" x2="200" y2="62"/>
      <line x1="25" y1="89" x2="200" y2="89"/><line x1="25" y1="112" x2="200" y2="112"/>
    </g>
    <g stroke="${C.axis}" stroke-width="1.8">
      <line x1="18" y1="75" x2="204" y2="75"/><line x1="110" y1="119" x2="110" y2="17"/>
    </g>
    ${inner}
  </svg>`;
}

function pathFromPoints(points, xMin, xMax, yMin, yMax){
  const X = x => 25 + (x-xMin)/(xMax-xMin)*175;
  const Y = y => 112 - (y-yMin)/(yMax-yMin)*90;
  return points.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
}
function sample(fn,a,b,n=130){
  const pts=[];
  for(let i=0;i<n;i++){const x=a+(b-a)*i/(n-1);pts.push([x,fn(x)]);}
  return pts;
}

function exponentialGraph(){
  const xMin=-2.2, xMax=1.7, yMin=0, yMax=6;
  const left=32, right=204, top=15, bottom=106;
  const X=x=>left+(x-xMin)/(xMax-xMin)*(right-left);
  const Y=y=>bottom-(y-yMin)/(yMax-yMin)*(bottom-top);
  const points=sample(x=>Math.exp(x),xMin,xMax,180);
  const path=points.map((point,index)=>(index?"L":"M")+X(point[0]).toFixed(1)+" "+Y(point[1]).toFixed(1)).join(" ");
  const xAxis=Y(0);
  const yAxis=X(0);
  const gridsX=[-2,-1,0,1].map(value=>`<line x1="${X(value)}" y1="${top}" x2="${X(value)}" y2="${bottom}"/>`).join("");
  const gridsY=[1,2,3,4,5].map(value=>`<line x1="${left}" y1="${Y(value)}" x2="${right}" y2="${Y(value)}"/>`).join("");
  return `<svg viewBox="0 0 220 130" role="img" aria-label="gráfico da função exponencial y igual a e elevado a x, passando pelo ponto zero um">
    <rect width="220" height="130" rx="9" fill="#FFFDEC"/>
    <g stroke="${C.grid}" stroke-width="1">${gridsX}${gridsY}</g>
    <g stroke="${C.axis}" stroke-width="1.8">
      <line x1="${left-4}" y1="${xAxis}" x2="${right+5}" y2="${xAxis}"/>
      <line x1="${yAxis}" y1="${bottom+5}" x2="${yAxis}" y2="${top-4}"/>
    </g>
    <path d="${path}" fill="none" stroke="${C.curve}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${X(0)}" cy="${Y(1)}" r="4.5" fill="${C.detail}" stroke="#FFFDEC" stroke-width="2"/>
    <text x="${X(0)+7}" y="${Y(1)-7}" font-size="11" font-weight="700" fill="${C.axis}">(0, 1)</text>
    <text x="${right+4}" y="${xAxis-4}" font-size="11" fill="${C.axis}">x</text>
    <text x="${yAxis+5}" y="${top}" font-size="11" fill="${C.axis}">y</text>
  </svg>`;
}

function graph(kind){
  let p="", extra="", label="";
  if(kind==="line"){
    p=pathFromPoints(sample(x=>2*x+1,-2,2),-2,2,-4,6); label="gráfico de uma reta crescente";
  }
  if(kind==="sine"){
    p=pathFromPoints(sample(x=>Math.sin(x),-Math.PI*2,Math.PI*2),-Math.PI*2,Math.PI*2,-1.6,1.6); label="gráfico da função seno";
  }
  if(kind==="exp"){
    return exponentialGraph();
  }
  if(kind==="circle"){
    label="circunferência unitária";
    return svgFrame(
      `<circle cx="110" cy="75" r="36" fill="none" stroke="${C.curve}" stroke-width="4"/>`,
      label
    );
  }
  if(kind==="ellipse"){
    const pts=[]; for(let i=0;i<=180;i++){const t=2*Math.PI*i/180;pts.push([1+2*Math.cos(t),Math.sin(t)]);}
    p=pathFromPoints(pts,-2,4,-2,2); label="elipse de centro um zero";
  }
  if(kind==="vhyper"){
    const up=[],down=[];
    for(let i=0;i<=100;i++){const x=-2.2+4.4*i/100;up.push([x,Math.sqrt(1+x*x)]);down.push([x,-Math.sqrt(1+x*x)]);}
    p=pathFromPoints(up,-3,3,-3.2,3.2);
    extra=`<path d="${pathFromPoints(down,-3,3,-3.2,3.2)}" fill="none" stroke="${C.curve}" stroke-width="4"/>`;
    label="hipérbole com eixo transverso vertical";
  }
  if(kind==="rightHyper"){
    const pts=[]; for(let t=-1.6;t<=1.6;t+=.025)pts.push([Math.cosh(t),Math.sinh(t)]);
    p=pathFromPoints(pts,-.5,3.2,-2.5,2.5); label="ramo direito da hipérbole";
  }
  if(kind==="rightCircle"){
    label="metade direita da circunferência";
    return svgFrame(
      `<path d="M 110 39 A 36 36 0 0 1 110 111" fill="none" stroke="${C.curve}" stroke-width="4" stroke-linecap="round"/>`,
      label
    );
  }
  if(kind==="lowerEllipse"){
    const pts=[]; for(let i=0;i<=140;i++){const t=Math.PI+Math.PI*i/140;pts.push([2*Math.cos(t),Math.sin(t)]);}
    p=pathFromPoints(pts,-2.6,2.6,-1.6,1.6); label="metade inferior da elipse";
  }
  return svgFrame(`<path d="${p}" fill="none" stroke="${C.curve}" stroke-width="4" stroke-linecap="round"/>${extra}`,label);
}

function realLife(kind){

      <path d="M50 70 L70 48 H145 L169 70 Z" fill="${C.fill}" stroke="${C.axis}" stroke-width="3"/>

      <circle cx="153" cy="75" r="13" fill="#FFFDEC" stroke="${C.axis}" stroke-width="4"/>
      <text x="110" y="105" text-anchor="middle" font-size="14" fill="${C.axis}">taxa fixa + preço por km</text>
    </svg>`;
  if(kind==="buoy") return `
    <svg viewBox="0 0 220 120" role="img" aria-label="boia oscilando nas ondas">
      <path d="M10 70 Q35 48 60 70 T110 70 T160 70 T210 70" fill="none" stroke="${C.curve}" stroke-width="5"/>
      <circle cx="111" cy="57" r="17" fill="${C.detail}"/>
      <rect x="108" y="30" width="6" height="18" fill="${C.axis}"/>
      <path d="M114 31 L143 39 L114 47 Z" fill="#FD5151"/>
      <text x="110" y="107" text-anchor="middle" font-size="14" fill="${C.axis}">movimento periódico</text>
    </svg>`;
  return `
    <svg viewBox="0 0 220 120" role="img" aria-label="colônia bacteriana duplicando de uma para duas, quatro e oito bactérias">
      <text x="110" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="${C.axis}">duplicação de uma colônia bacteriana</text>
      <g fill="none" stroke="${C.grid}" stroke-width="1.5">
        <circle cx="29" cy="57" r="23"/><circle cx="82" cy="57" r="23"/>
        <circle cx="137" cy="57" r="23"/><circle cx="191" cy="57" r="23"/>
      </g>
      <g fill="${C.curve}" stroke="${C.axis}" stroke-width="1">
        <circle cx="29" cy="57" r="5"/>
        <circle cx="76" cy="57" r="5"/><circle cx="88" cy="57" r="5"/>
        <circle cx="131" cy="51" r="4.5"/><circle cx="143" cy="51" r="4.5"/>
        <circle cx="131" cy="63" r="4.5"/><circle cx="143" cy="63" r="4.5"/>
        <circle cx="183" cy="47" r="3.7"/><circle cx="193" cy="47" r="3.7"/>
        <circle cx="183" cy="57" r="3.7"/><circle cx="193" cy="57" r="3.7"/>
        <circle cx="183" cy="67" r="3.7"/><circle cx="193" cy="67" r="3.7"/>
        <circle cx="188" cy="52" r="3.7"/><circle cx="188" cy="62" r="3.7"/>
      </g>
      <g fill="${C.detail}" font-size="13" font-weight="800" text-anchor="middle">
        <text x="29" y="96">1</text><text x="82" y="96">2</text>
        <text x="137" y="96">4</text><text x="191" y="96">8</text>
      </g>
      <g fill="${C.axis}" font-size="9" text-anchor="middle">
        <text x="29" y="110">t = 0</text><text x="82" y="110">t = 1</text>
        <text x="137" y="110">t = 2</text><text x="191" y="110">t = 3</text>
      </g>
      <g stroke="${C.detail}" stroke-width="2" fill="none">
        <path d="M53 57h5l-3-3m3 3-3 3"/><path d="M106 57h5l-3-3m3 3-3 3"/>
        <path d="M161 57h5l-3-3m3 3-3 3"/>
      </g>
    </svg>`;
}


function latex(expression){
  return `<div class="math latex">\\[${expression}\\]</div>`;
}
function alignedLatex(lines){
  return latex(`\\begin{aligned}${lines.join('\\\\')}\\end{aligned}`);
}

const LEVELS = [
{

  headers:[
    ["lingua","Língua materna"],

  ],
  curves:[

},
{

  description:"Registros: língua materna, equação cartesiana, equação paramétrica e lugar geométrico.",
  headers:[
    ["lingua","Língua materna"],
    ["cart","Equação cartesiana"],

  ],
  curves:[
    {
      id:"circ", name:"Circunferência",
      cards:{
        lingua:`<strong>Circunferência</strong>Centro (0,0) e raio 1.`,

      }

let levelIndex=0;
let placements=[];
let selectedCard=null;
let checkedRows=[];
let bankOrder=[];
let pieceNodes=new Map();

const REPORT_KEY="duvalLearningReportV3";

const GAME_STATE_KEY="duvalGameStateV2";
let levelHasRendered=false;

function newGameState(){
  return {
    version:2,
    currentLevel:0,
    levels:LEVELS.map(()=>({
      placements:Array(12).fill(null),
      bankOrder:[],
      checkedRows:[]
    }))
  };
}
function loadGameState(){
  try{
    const saved=JSON.parse(localStorage.getItem(GAME_STATE_KEY)||"null");
    if(saved && saved.version===2 && Array.isArray(saved.levels) && saved.levels.length===LEVELS.length){
      return saved;
    }
  }catch(error){}
  return newGameState();
}
let gameState=loadGameState();

function saveGameState(){
  gameState.currentLevel=levelIndex;
  localStorage.setItem(GAME_STATE_KEY,JSON.stringify(gameState));
}
function saveCurrentLevelState(){
  if(!gameState.levels[levelIndex]) return;
  gameState.levels[levelIndex]={
    placements:[...placements],
    bankOrder:[...bankOrder],
    checkedRows:checkedRows.map(row=>({...row}))
  };
  saveGameState();
}
function restoreLevelState(index){
  const state=gameState.levels[index]||{};
  const validIds=new Set(allCards(LEVELS[index]).map(card=>card.id));
  const restoredPlacements=Array.isArray(state.placements) && state.placements.length===12
    ? state.placements.map(id=>id && validIds.has(id) ? id : null)
    : Array(12).fill(null);
  const used=new Set();
  placements=restoredPlacements.map(id=>{
    if(!id || used.has(id)) return null;
    used.add(id);
    return id;
  });
  bankOrder=Array.isArray(state.bankOrder) && state.bankOrder.length===12 && state.bankOrder.every(id=>validIds.has(id))
    ? [...state.bankOrder]
    : [];
  checkedRows=Array.isArray(state.checkedRows) ? state.checkedRows.map(row=>({...row})) : [];
}


function emptyLevelStats(){
  return {
    startedAt:null,
    elapsedMs:0,
    verifications:0,
    perfectVerifications:0,
    incompleteVerifications:0,
    rowHits:0,
    rowErrors:0,
    bestCorrect:0,
    moves:0,
    resets:0,
    shuffles:0,
    solutionUsed:false,
    completed:false,
    completedAt:null
  };
}
function newReportData(){
  return {
    version:3,
    studentName:"",
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    levels:LEVELS.map(()=>emptyLevelStats())
  };
}
function loadReportData(){
  try{
    const saved=JSON.parse(localStorage.getItem(REPORT_KEY)||"null");
    if(saved && saved.version===3 && Array.isArray(saved.levels) && saved.levels.length===LEVELS.length){
      return saved;
    }
  }catch(error){}
  return newReportData();
}

let reportData=loadReportData();
let bestScores=reportData.levels.map(level=>Number(level.bestCorrect)||0);
let activeLevelStartedAt=null;

function saveReportData(){
  reportData.updatedAt=new Date().toISOString();
  localStorage.setItem(REPORT_KEY,JSON.stringify(reportData));
}
function pauseActiveTimer(){
  if(activeLevelStartedAt===null) return;
  reportData.levels[levelIndex].elapsedMs += Math.max(0,Date.now()-activeLevelStartedAt);
  activeLevelStartedAt=null;
  saveReportData();
}
function startActiveTimer(){
  const stats=reportData.levels[levelIndex];
  if(!stats.startedAt) stats.startedAt=new Date().toISOString();
  activeLevelStartedAt=Date.now();
  saveReportData();
}
function currentElapsed(index){
  const base=Number(reportData.levels[index].elapsedMs)||0;
  if(index===levelIndex && activeLevelStartedAt!==null){
    return base+Math.max(0,Date.now()-activeLevelStartedAt);
  }
  return base;
}


function clearTypesetMath(container){
  if(container && window.MathJax && typeof window.MathJax.typesetClear==="function"){
    window.MathJax.typesetClear([container]);
  }
}
function typesetMath(container){
  if(!container || !window.MathJax || typeof window.MathJax.typesetPromise!=="function") return;
  window.MathJax.typesetPromise([container]).catch(error=>console.warn("MathJax:",error));
}

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
}
function allCards(level){
  const cards=[];
  level.curves.forEach(curve=>{
    level.headers.forEach(([key,label])=>{
      cards.push({
        id:`${curve.id}__${key}`,
        curve:curve.id,
        curveName:curve.name,
        category:key,
        categoryName:label,
        html:curve.cards[key]
      });
    });
  });
  return cards;
}
function cardById(id){return allCards(LEVELS[levelIndex]).find(c=>c.id===id)}
function initLevel(index){
  if(levelHasRendered){
    pauseActiveTimer();
    saveCurrentLevelState();
  }
  levelIndex=Math.max(0,Math.min(LEVELS.length-1,index));
  selectedCard=null;
  restoreLevelState(levelIndex);
  renderTabs();
  renderGame();
  levelHasRendered=true;
  saveCurrentLevelState();
  startActiveTimer();
}
function renderTabs(){
  const nav=document.getElementById("levelTabs");
  nav.innerHTML=LEVELS.map((l,i)=>`<button class="level-tab ${reportData.levels[i].completed?"completed":""}" type="button" data-level="${i}" aria-selected="${i===levelIndex}">${i+1}º nível</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>initLevel(Number(b.dataset.level))));
}
function renderGame(){

      </div>
    </div>
    <div class="bank-title">Peças embaralhadas</div>

function clearRowMarks(){
  document.querySelectorAll(".slot").forEach(slot=>{
    slot.classList.remove("row-correct","row-wrong","drag-over");
  });
}
function syncSelectionStyles(){
  document.querySelectorAll(".piece").forEach(piece=>{
    piece.classList.toggle("selected",piece.dataset.card===selectedCard);
  });
}
function getHomeCell(id){
  const node=pieceNodes.get(id);
  return node ? document.querySelector(`.bank-cell[data-home="${node.dataset.home}"]`) : null;
}
function moveToBank(id){
  const node=pieceNodes.get(id);
  const cell=getHomeCell(id);
  if(node && cell) cell.appendChild(node);
}

function renderPieces(initialShuffle=false){
  const level=LEVELS[levelIndex];
  const cards=allCards(level);
  const ids=cards.map(card=>card.id);

  if(initialShuffle || bankOrder.length!==ids.length){
    bankOrder=shuffle(ids);
  }

  const bank=document.getElementById("bank");
  bank.innerHTML=bankOrder.map((id,index)=>
    `<div class="bank-cell" data-home="${index}" aria-label="posição das peças ${index+1}"></div>`
  ).join("");

  pieceNodes=new Map();
  bankOrder.forEach((id,index)=>{
    const card=cards.find(item=>item.id===id);
    const piece=makePiece(card);
    piece.dataset.home=String(index);
    pieceNodes.set(id,piece);
    bank.querySelector(`.bank-cell[data-home="${index}"]`).appendChild(piece);
  });

  document.querySelectorAll(".slot").forEach(slot=>{
    slot.querySelectorAll(".piece").forEach(piece=>piece.remove());
  });

  placements.forEach((id,index)=>{
    if(!id) return;
    const piece=pieceNodes.get(id);
    const slot=document.querySelector(`.slot[data-slot="${index}"]`);
    if(piece && slot) slot.appendChild(piece);
  });

  clearRowMarks();
  applyRowMarks();
  bindDropTargets();
  syncSelectionStyles();
  typesetMath(document.getElementById("gameArea"));
}

function makePiece(card){
  const div=document.createElement("div");
  div.className="piece";
  div.draggable=true;
  div.tabIndex=0;
  div.dataset.card=card.id;
  div.setAttribute("aria-label",`${card.categoryName}: ${card.curveName}`);
  div.innerHTML=`<span class="tag">${card.categoryName}</span><div class="content">${card.html}</div><button class="return-btn" type="button">Retirar</button>`;

  div.addEventListener("dragstart",event=>{
    selectedCard=card.id;
    syncSelectionStyles();
    event.dataTransfer.setData("text/plain",card.id);
    event.dataTransfer.effectAllowed="move";
  });

  div.addEventListener("click",event=>{
    if(event.target.classList.contains("return-btn")){
      event.stopPropagation();
      removeCard(card.id);
      return;
    }
    selectedCard=selectedCard===card.id ? null : card.id;
    syncSelectionStyles();
  });

  div.addEventListener("keydown",event=>{
    if(event.key==="Enter" || event.key===" "){
      event.preventDefault();
      div.click();
    }
  });
  return div;
}

function bindDropTargets(){
  document.querySelectorAll(".slot").forEach(slot=>{
    if(slot.dataset.dropReady==="1") return;
    slot.dataset.dropReady="1";

    slot.addEventListener("dragover",event=>{
      event.preventDefault();
      slot.classList.add("drag-over");
    });
    slot.addEventListener("dragleave",()=>slot.classList.remove("drag-over"));
    slot.addEventListener("drop",event=>{
      event.preventDefault();
      slot.classList.remove("drag-over");
      const id=event.dataTransfer.getData("text/plain") || selectedCard;
      if(id) placeCard(id,Number(slot.dataset.slot));
    });
    slot.addEventListener("click",event=>{
      if(event.target.closest(".piece")) return;
      if(selectedCard) placeCard(selectedCard,Number(slot.dataset.slot));
    });
    slot.addEventListener("keydown",event=>{
      if((event.key==="Enter" || event.key===" ") && selectedCard){
        event.preventDefault();
        placeCard(selectedCard,Number(slot.dataset.slot));
      }
    });
  });

  const bank=document.getElementById("bank");
  if(bank.dataset.dropReady!=="1"){
    bank.dataset.dropReady="1";
    bank.addEventListener("dragover",event=>event.preventDefault());
    bank.addEventListener("drop",event=>{
      event.preventDefault();
      const id=event.dataTransfer.getData("text/plain") || selectedCard;
      if(id) removeCard(id);
    });
  }
}

function placeCard(id,slotIndex){
  const piece=pieceNodes.get(id);
  const target=document.querySelector(`.slot[data-slot="${slotIndex}"]`);
  if(!piece || !target) return;

  const oldIndex=placements.indexOf(id);
  if(oldIndex===slotIndex){
    selectedCard=null;
    syncSelectionStyles();
    return;
  }

  if(oldIndex>=0) placements[oldIndex]=null;

  const displaced=placements[slotIndex];
  if(displaced && displaced!==id){
    placements[slotIndex]=null;
    moveToBank(displaced);
  }

  placements[slotIndex]=id;
  target.appendChild(piece);

  reportData.levels[levelIndex].moves++;
  saveReportData();

  selectedCard=null;
  checkedRows=[];
  saveCurrentLevelState();
  clearRowMarks();
  syncSelectionStyles();
  clearFeedback();
}

function removeCard(id){
  const oldIndex=placements.indexOf(id);
  if(oldIndex>=0) placements[oldIndex]=null;

  moveToBank(id);
  reportData.levels[levelIndex].moves++;
  saveReportData();

  selectedCard=null;
  checkedRows=[];
  saveCurrentLevelState();
  clearRowMarks();
  syncSelectionStyles();
  clearFeedback();
}
function rowResult(row){
  const level=LEVELS[levelIndex];
  const ids=placements.slice(row*4,row*4+4);
  if(ids.some(x=>!x)) return {complete:false,correct:false};
  const cards=ids.map(cardById);
  const categoriesCorrect=cards.every((c,col)=>c.category===level.headers[col][0]);
  const sameCurve=cards.every(c=>c.curve===cards[0].curve);
  return {complete:true,correct:categoriesCorrect&&sameCurve,curve:cards[0].curveName};
}
function check(){
  checkedRows=[0,1,2].map(rowResult);
  applyRowMarks();

  const complete=checkedRows.filter(result=>result.complete).length;
  const correct=checkedRows.filter(result=>result.correct).length;
  const stats=reportData.levels[levelIndex];

  stats.verifications++;
  stats.rowHits+=correct;
  stats.rowErrors+=Math.max(0,complete-correct);
  if(complete<3) stats.incompleteVerifications++;
  if(correct===3) stats.perfectVerifications++;
  stats.bestCorrect=Math.max(stats.bestCorrect,correct);

  if(correct===3 && !stats.completed){
    stats.completed=true;
    stats.completedAt=new Date().toISOString();
  }

  bestScores[levelIndex]=stats.bestCorrect;
  saveReportData();
  saveCurrentLevelState();
  renderTabs();
  updateReportAvailability(correct===3);
  document.querySelector(".status").textContent=`Melhor resultado: ${stats.bestCorrect}/3 linhas`;

  const fb=document.getElementById("feedback");
  fb.className="feedback show "+(correct===3?"ok":complete<3?"warn":"bad");

  if(correct===3){
    fb.innerHTML=`<strong>Tabuleiro concluído.</strong> Você relacionou corretamente as três curvas. As informações desta tentativa já foram registradas no relatório.`;
  }else if(complete<3){
    fb.innerHTML=`Você completou ${complete} de 3 linhas e acertou ${correct}. Preencha todas as posições antes da verificação final.`;
  }else{
    fb.innerHTML=`${correct} de 3 linhas estão corretas. Observe as linhas destacadas e compare domínio, centro, orientação, restrições e comportamento do gráfico.`;
  }
}

function applyRowMarks(){
  if(!checkedRows.length)return;
  checkedRows.forEach((result,row)=>{
    for(let col=0;col<4;col++){
      const slot=document.querySelector(`.slot[data-slot="${row*4+col}"]`);
      slot.classList.add(result.correct?"row-correct":"row-wrong");
    }
  });
}
function clearFeedback(){
  const fb=document.getElementById("feedback");
  if(fb){fb.className="feedback";fb.innerHTML="";}
}
function reset(action="reset"){
  const message=action==="shuffle"
    ? "Embaralhar novamente retirará todas as peças deste nível. Deseja continuar?"
    : "Retirar todas apagará a montagem atual deste nível. Deseja continuar?";
  if(!window.confirm(message)) return;

  const stats=reportData.levels[levelIndex];
  if(action==="shuffle") stats.shuffles++;
  else stats.resets++;
  saveReportData();

  placements=Array(12).fill(null);
  selectedCard=null;
  checkedRows=[];
  bankOrder=[];
  renderPieces(true);
  saveCurrentLevelState();
  clearFeedback();
}
function showSolution(){
  if(!window.confirm("A solução preencherá o tabuleiro e ficará registrada no relatório. Deseja continuar?")) return;
  const stats=reportData.levels[levelIndex];
  stats.solutionUsed=true;
  saveReportData();

  const level=LEVELS[levelIndex];
  const solution=[];
  level.curves.forEach(curve=>level.headers.forEach(([key])=>solution.push(`${curve.id}__${key}`)));
  placements=solution;
  checkedRows=[0,1,2].map(rowResult);
  renderPieces(false);
  saveCurrentLevelState();

  const fb=document.getElementById("feedback");
  fb.className="feedback show warn";
  fb.innerHTML="<strong>Solução exibida.</strong> O relatório indicará que houve consulta ao gabarito neste nível.";
}
function bindControls(){
  document.getElementById("checkBtn").addEventListener("click",check);
  document.getElementById("resetBtn").addEventListener("click",()=>reset("reset"));
  document.getElementById("shuffleBtn").addEventListener("click",()=>reset("shuffle"));
  document.getElementById("solutionBtn").addEventListener("click",showSolution);
}

function formatDuration(milliseconds){
  const totalSeconds=Math.max(0,Math.round(milliseconds/1000));
  const hours=Math.floor(totalSeconds/3600);
  const minutes=Math.floor((totalSeconds%3600)/60);
  const seconds=totalSeconds%60;
  if(hours>0) return `${hours}h ${minutes}min ${seconds}s`;
  if(minutes>0) return `${minutes}min ${seconds}s`;
  return `${seconds}s`;
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}
function snapshotReport(){
  return {
    studentName:(reportData.studentName||"").trim(),
    generatedAt:new Date(),
    levels:reportData.levels.map((stats,index)=>({
      ...stats,
      elapsedMs:currentElapsed(index)
    }))
  };
}
function feedbackForLevel(index,stats){
  const focus=[
    "a articulação entre linguagem materna, expressão algébrica, gráfico e situação contextual",
    "o reconhecimento de centro, raio, semieixos, orientação e parametrização das cônicas",
    "a interpretação das restrições e dos intervalos do parâmetro que selecionam apenas partes das curvas"
  ][index];

  if(stats.bestCorrect===3 && stats.rowErrors===0 && !stats.solutionUsed){
    return `Desempenho consistente em ${focus}.`;
  }
  if(stats.bestCorrect===3 && !stats.solutionUsed){
    return `O nível foi concluído, mas as tentativas indicam que vale revisar ${focus}.`;
  }
  if(stats.solutionUsed){
    return `Houve consulta à solução. Recomenda-se refazer o nível sem o gabarito, concentrando-se em ${focus}.`;
  }
  if(stats.bestCorrect===2){
    return `Há domínio parcial. O próximo passo é revisar ${focus}.`;
  }
  if(stats.bestCorrect===1){
    return `Foi estabelecida uma associação correta, mas ainda há dificuldade em ${focus}.`;
  }
  return `Ainda não houve uma associação completa correta. Retome ${focus}.`;
}
function overallFeedback(score,levels){
  const usedSolution=levels.some(level=>level.solutionUsed);
  const totalErrors=levels.reduce((sum,level)=>sum+level.rowErrors,0);

  let message="";
  if(score>=90) message="O estudante demonstrou domínio amplo das conversões entre os registros de representação.";
  else if(score>=70) message="O estudante demonstrou boa compreensão, com algumas conversões que ainda precisam de consolidação.";
  else if(score>=40) message="O estudante apresentou compreensão parcial e se beneficiará de uma retomada orientada das relações entre os registros.";
  else message="O resultado indica necessidade de intervenção pedagógica, com comparação explícita entre registros e justificativas matemáticas.";

  if(totalErrors>0){
    message+=` Foram identificadas ${totalErrors} linha${totalErrors===1?" incorreta":"s incorretas"} ao longo das verificações.`;
  }
  if(usedSolution){
    message+=" Como a solução foi consultada em pelo menos um nível, o percentual deve ser interpretado como diagnóstico de estudo, e não como nota autônoma.";
  }
  return message;
}
function allLevelsCompleted(){
  return reportData.levels.every(level=>level.completed);
}
function updateReportAvailability(reveal=false){

function reportCalculations(snapshot){
  const bestRows=snapshot.levels.reduce((sum,level)=>sum+level.bestCorrect,0);
  const totalChecks=snapshot.levels.reduce((sum,level)=>sum+level.verifications,0);
  const rowHits=snapshot.levels.reduce((sum,level)=>sum+level.rowHits,0);
  const rowErrors=snapshot.levels.reduce((sum,level)=>sum+level.rowErrors,0);
  const moves=snapshot.levels.reduce((sum,level)=>sum+level.moves,0);
  const elapsed=snapshot.levels.reduce((sum,level)=>sum+level.elapsedMs,0);
  const completed=snapshot.levels.filter(level=>level.completed).length;
  const score=Math.round(bestRows/9*100);
  return {bestRows,totalChecks,rowHits,rowErrors,moves,elapsed,completed,score};
}
function renderReport(shouldScroll=true){

      <div class="report-metric"><span>Movimentações de peças</span><strong>${totals.moves}</strong></div>
      <div class="report-metric"><span>Tempo total</span><strong>${formatDuration(totals.elapsed)}</strong></div>
    </div>

    ${snapshot.levels.map((stats,index)=>`
      <article class="level-report">

          <li>Reinícios: <strong>${stats.resets}</strong> | Embaralhamentos: <strong>${stats.shuffles}</strong></li>
          <li>Consulta à solução: <strong>${stats.solutionUsed?"sim":"não"}</strong></li>
        </ul>
        <div class="level-feedback"><strong>Feedback:</strong> ${escapeHtml(feedbackForLevel(index,stats))}</div>
      </article>
    `).join("")}

    <div class="final-feedback">
      <strong>Síntese pedagógica:</strong> ${escapeHtml(overallFeedback(totals.score,snapshot.levels))}
    </div>
    <div class="report-note">
      Os dados ficam armazenados apenas neste navegador. Para entregar o relatório ao professor, use “Baixar relatório em TXT” ou “Imprimir ou salvar em PDF”.
    </div>`;

  output.classList.add("show");
  if(shouldScroll) output.scrollIntoView({behavior:"smooth",block:"start"});
}

  snapshot.levels.forEach((stats,index)=>{

      `Linhas corretas nas verificações: ${stats.rowHits}`,
      `Linhas incorretas: ${stats.rowErrors}`,
      `Verificações incompletas: ${stats.incompleteVerifications}`,
      `Tempo: ${formatDuration(stats.elapsedMs)}`,
      `Reinícios: ${stats.resets}`,
      `Embaralhamentos: ${stats.shuffles}`,
      `Consulta à solução: ${stats.solutionUsed?"sim":"não"}`,
      `Feedback: ${feedbackForLevel(index,stats)}`,
      ""
    );
  });

  lines.push(`SÍNTESE PEDAGÓGICA: ${overallFeedback(totals.score,snapshot.levels)}`);
  lines.push("");
  lines.push("Observação: os dados foram produzidos localmente no navegador do aluno.");
  return lines.join("\n");
}
function safeFileName(value){
  return (value||"aluno")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9_-]+/g,"_")
    .replace(/^_+|_+$/g,"")
    .toLowerCase()||"aluno";
}
function downloadReport(){
  if(!allLevelsCompleted()) return;
  renderReport();
  const text=reportAsText();
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`relatorio_quebra_cabeca_${safeFileName(reportData.studentName)}.txt`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}

async function shareReport(){
  if(!allLevelsCompleted()) return;
  const text=reportAsText();
  const title=`Relatório do quebra-cabeça — ${(reportData.studentName||"Aluno").trim()||"Aluno"}`;
  try{
    if(navigator.share){
      await navigator.share({title,text});
      return;
    }
    await copyReport();
    window.alert("O compartilhamento direto não está disponível neste aparelho. O relatório foi copiado.");
  }catch(error){
    if(error && error.name!=="AbortError") console.warn(error);
  }
}
async function copyReport(){
  if(!allLevelsCompleted()) return;
  const text=reportAsText();
  try{
    await navigator.clipboard.writeText(text);
    window.alert("Relatório copiado para a área de transferência.");
  }catch(error){
    const area=document.createElement("textarea");
    area.value=text;
    area.style.position="fixed";
    area.style.opacity="0";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    window.alert("Relatório copiado para a área de transferência.");
  }
}

function printReport(){
  if(!allLevelsCompleted()) return;
  renderReport();
  document.body.classList.add("printing-report");
  window.print();
  setTimeout(()=>document.body.classList.remove("printing-report"),800);
}
function resetReportData(){
  const confirmed=window.confirm("Deseja apagar todas as estatísticas e iniciar o relatório de um novo aluno?");
  if(!confirmed) return;

  activeLevelStartedAt=null;
  reportData=newReportData();
  gameState=newGameState();
  bestScores=[0,0,0];
  localStorage.removeItem("duvalBestScores");
  localStorage.removeItem(GAME_STATE_KEY);
  saveReportData();
  saveGameState();

  const input=document.getElementById("studentName");
  if(input) input.value="";
  const output=document.getElementById("reportOutput");
  if(output){
    output.className="report-output";
    output.innerHTML="";
  }
  levelHasRendered=false;
  updateReportAvailability();
  initLevel(0);
}
window.addEventListener("beforeunload",()=>{saveCurrentLevelState();pauseActiveTimer();});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    saveCurrentLevelState();
    pauseActiveTimer();
  }else if(activeLevelStartedAt===null){
    startActiveTimer();
  }
});
window.addEventListener("afterprint",()=>document.body.classList.remove("printing-report"));

ensureReportUI();
initLevel(Number(gameState.currentLevel)||0);

})();
</script>
